<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timeless Objects</title>
  <meta name="description" content="Everyday objects whose design hasn't changed since they were invented.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e9b872'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <h1>Timeless Objects</h1>
        <p class="tagline">Things we got right the first time</p>
      </div>
    </div>

    <div class="search" role="search">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Search objects, places, inventors…" autocomplete="off"
             aria-label="Search objects" aria-controls="results" aria-expanded="false">
      <kbd class="search-hint">/</kbd>
      <ul id="results" class="results" role="listbox" hidden></ul>
    </div>

    <div class="count" id="count">Loading…</div>
  </header>

  <nav class="chips" id="chips" aria-label="Filter by category"></nav>

  <main class="stage" id="stage">
    <article class="detail" id="detail" aria-live="polite">
      <div class="empty">Hover the timeline below or search to explore.</div>
    </article>
  </main>

  <section class="timeline-wrap" aria-label="Timeline">
    <div class="eras" id="eras"></div>
    <div class="timeline" id="timeline">
      <div class="edge edge-left" aria-hidden="true"></div>
      <div class="edge edge-right" aria-hidden="true"></div>
      <div class="track" id="track"></div>
    </div>
    <div class="timeline-help">Move toward the edges to travel through time · scroll to move faster · hover a marker for details</div>
  </section>

  <script src="app.js"></script>
</body>
</html>
